[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skeptical-control-research-engine"
version = "1.0.0"
description = "Research engine for Skeptical Control platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
    "docker>=6.1.3",
    "pyyaml>=6.0.1",
    "zipfile-deflate64>=0.0.3",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/__tests__"]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-asyncio>=0.23"]

