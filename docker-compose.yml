services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: skeptical-control-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skeptical}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skeptical_dev}
      POSTGRES_DB: ${POSTGRES_DB:-skeptical_control}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skeptical}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skeptical-control-backend
    command: ["sh", "-c", "npm run migrate:up && npm start"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-skeptical}:${POSTGRES_PASSWORD:-skeptical_dev}@postgres:5432/${POSTGRES_DB:-skeptical_control}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      RESEARCH_ENGINE_URL: http://research-engine:8000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
      - project_uploads:/app/uploads
      - workspaces:/app/workspaces

  # Research Engine (Python/FastAPI)
  research-engine:
    build:
      context: ./research-engine
      dockerfile: Dockerfile
    container_name: skeptical-control-research-engine
    environment:
      PYTHONUNBUFFERED: 1
      WORKSPACE_DIR: /app/workspaces
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-104857600}
      MAX_EXTRACTED_SIZE: ${MAX_EXTRACTED_SIZE:-524288000}
      DOCKER_CPU_LIMIT: ${DOCKER_CPU_LIMIT:-2}
      DOCKER_MEMORY_LIMIT: ${DOCKER_MEMORY_LIMIT:-2g}
      DOCKER_TIME_LIMIT: ${DOCKER_TIME_LIMIT:-300}
      TOXIPROXY_URL: http://toxiproxy:8474
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - ./research-engine:/app
      - /app/__pycache__
      - project_uploads:/app/uploads
      - workspaces:/app/workspaces
      - ./infrastructure/locust:/app/locust:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: skeptical-control-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.2
    container_name: skeptical-control-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  locust:
    image: locustio/locust:2.31.8
    container_name: skeptical-control-locust
    command: ['-f', '/mnt/locust/locustfile.py', '--master', '--host', 'http://backend:3001']
    volumes:
      - ./infrastructure/locust:/mnt/locust:ro
    ports:
      - "8089:8089"
    depends_on:
      - backend

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: skeptical-control-toxiproxy
    ports:
      - "8474:8474"
      - "22220-22229:22220-22229"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: skeptical-control-otel
    command: ['--config=/etc/otel-collector-config.yml']
    volumes:
      - ./infrastructure/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  # Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: skeptical-control-frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
      API_PROXY_TARGET: http://backend:3001
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  project_uploads:
  workspaces:
