# Template for isolated testbed environments
# This file is dynamically generated by the research engine with resource limits applied

version: '3.8'

services:
  # Example service - this is replaced with actual project services
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    networks:
      - isolated_network
    # Resource limits are dynamically applied
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

networks:
